name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend tests
        run: npm test
      - name: Browser tests (booking flow)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
