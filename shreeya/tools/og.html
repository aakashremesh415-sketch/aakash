<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Montserrat";src:url("../assets/fonts/montserrat-latin.woff2") format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:Montserrat,sans-serif;background:#fff;color:#061425;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 85% 10%,rgba(6,72,174,.18),transparent 70%),linear-gradient(#dde2ea 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,#dde2ea 1px,transparent 1px) 0 0/56px 56px;-webkit-mask-image:radial-gradient(ellipse 90% 90% at 70% 30%,#000 30%,transparent 80%)}
.wrap{position:relative;display:grid;grid-template-columns:1fr 420px;gap:56px;align-items:center;height:100%;padding:0 72px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border:1px solid #dde2ea;border-radius:999px;color:#0648ae;font-weight:600;font-size:22px;background:#fff}
.pill:before{content:"";width:10px;height:10px;border-radius:50%;background:#0648ae;box-shadow:0 0 0 5px rgba(6,72,174,.12)}
h1{font-size:64px;line-height:1.05;letter-spacing:-.03em;margin:26px 0 18px;font-weight:700}
h1 span{color:#0648ae}
p{font-size:27px;line-height:1.4;color:#4a5568;font-weight:500}
.foot{display:flex;align-items:center;gap:16px;margin-top:34px;font-weight:700;font-size:24px}
.foot img{width:52px;height:52px}
.foot small{display:block;font-size:18px;color:#0648ae;font-weight:600}
.ph{width:420px;height:420px;border-radius:36px;overflow:hidden;background:#d9eafd;box-shadow:0 40px 90px -40px rgba(6,20,37,.55)}
.ph img{width:100%;height:100%;object-fit:cover}
</style></head><body><div class="bg"></div><div class="wrap"><div>
<span class="pill">Chartered Accountant</span>
<h1>CA Shreeya<br><span>Mundade</span></h1>
<p>Bookkeeping, month-end close, cleanups and virtual CFO for eCommerce brands and growing businesses.</p>
<div class="foot"><img src="../assets/brand/sm.svg"><div>shreeyamundade.com<small>Top Rated Plus · 100% Job Success on Upwork</small></div></div>
</div><div class="ph"><img src="../assets/img/shreeya-c.webp"></div></div></body></html>
